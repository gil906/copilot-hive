<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360">
  <defs>
    <linearGradient id="bgPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d16"/>
      <stop offset="100%" style="stop-color:#141b29"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="920" height="360" rx="12" fill="url(#bgPipe)"/>
  <rect x="1" y="1" width="918" height="358" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="28" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f0b429">⚡ PIPELINE STATE MACHINE &amp; 5 SMART ORCHESTRATION TOPOLOGIES (v2.0)</text>

  <!-- 5 Topologies Selector Pill Bar -->
  <g transform="translate(30, 42)">
    <rect x="0" y="0" width="164" height="26" rx="13" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="82" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">🔄 cyclic-pipeline</text>

    <rect x="174" y="0" width="154" height="26" rx="13" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="251" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#58a6ff">⭐ star-hub</text>

    <rect x="338" y="0" width="154" height="26" rx="13" fill="#161b22" stroke="#a371f7" stroke-width="1.2"/>
    <text x="415" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#d2a8ff">🕸️ dag-mesh</text>

    <rect x="502" y="0" width="174" height="26" rx="13" fill="#1c2536" stroke="#00d4ff" stroke-width="1.8"/>
    <text x="589" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4ff" font-weight="700">🧠 adaptive-swarm ★</text>

    <rect x="686" y="0" width="174" height="26" rx="13" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
    <text x="773" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff7b72">🛡️ self-healing-ring</text>
  </g>

  <!-- IDLE / TOPOLOGY ROUTING -->
  <g filter="url(#sh)">
    <rect x="35" y="105" width="160" height="74" rx="37" fill="#21262d" stroke="#00d4ff" stroke-width="2"/>
    <text x="115" y="138" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="700">💤 IDLE / ROUTE</text>
    <text x="115" y="156" text-anchor="middle" font-family="monospace" font-size="9" fill="#00d4ff">utility + ICE score</text>
    <text x="115" y="169" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b949e">next-agent selected</text>
  </g>

  <!-- Arrow: IDLE → RUNNING -->
  <line x1="200" y1="142" x2="245" y2="142" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="222" y="134" text-anchor="middle" font-family="monospace" font-size="8" fill="#3fb950">launch</text>

  <!-- RUNNING -->
  <g filter="url(#sh)">
    <rect x="250" y="105" width="170" height="74" rx="37" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <circle cx="274" cy="136" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="342" y="138" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="700">🔧 RUNNING</text>
    <text x="335" y="156" text-anchor="middle" font-family="monospace" font-size="9" fill="#3fb950">ctx-search + code</text>
    <text x="335" y="169" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b949e">🔐 gitguardian scan</text>
  </g>

  <!-- Arrow: RUNNING → WAITING -->
  <line x1="425" y1="142" x2="465" y2="142" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="445" y="134" text-anchor="middle" font-family="monospace" font-size="8" fill="#58a6ff">push</text>

  <!-- WAITING DEPLOY & REGRESSION -->
  <g filter="url(#sh)">
    <rect x="470" y="105" width="195" height="74" rx="37" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="498" cy="142" r="8" fill="none" stroke="#58a6ff" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,50;50,0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="576" y="138" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="700">⏳ DEPLOY &amp; TEST</text>
    <text x="572" y="156" text-anchor="middle" font-family="monospace" font-size="9" fill="#58a6ff">verify /api/version</text>
    <text x="572" y="169" text-anchor="middle" font-family="monospace" font-size="8" fill="#d2a8ff">🧪 regression + 🔍 audit</text>
  </g>

  <!-- Arrow: WAITING → IDLE (success) -->
  <path d="M 670 142 Q 730 142 730 92 Q 730 78 420 78 Q 115 78 115 100" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="425" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="#3fb950">✅ version verified + ctx-index synced → smart-route next agent</text>

  <!-- Arrow: WAITING → FIXING (failure) -->
  <line x1="567" y1="182" x2="567" y2="225" stroke="#f85149" stroke-width="2" marker-end="url(#arR)" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <text x="605" y="208" font-family="monospace" font-size="8" fill="#f85149">failed / down!</text>

  <!-- FIXING -->
  <g filter="url(#sh)">
    <rect x="470" y="230" width="195" height="76" rx="38" fill="#21262d" stroke="#f85149" stroke-width="2"/>
    <circle cx="498" cy="268" r="5" fill="#f85149">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="575" y="258" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="700">🔧 SELF-HEALING</text>
    <text x="572" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#f85149">breaker retry (max 2x)</text>
    <text x="572" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b949e">→ 🚑 Emergency Fixer + Rollback</text>
  </g>

  <!-- Arrow: FIXING → WAITING (retry) -->
  <path d="M 670 268 Q 715 268 715 205 Q 715 142 670 142" fill="none" stroke="#f0b429" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="735" y="208" font-family="monospace" font-size="8" fill="#f0b429">retry</text>

  <!-- Context-Mode Telemetry Card -->
  <g transform="translate(35, 225)">
    <rect x="0" y="0" width="390" height="86" rx="8" fill="#131926" stroke="#30363d" stroke-width="1.2"/>
    <text x="16" y="22" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#00d4ff">🧠 Context-Mode Engine &amp; Dispatcher Telemetry</text>
    <text x="16" y="42" font-family="monospace" font-size="9.5" fill="#c9d1d9">• BM25 + Porter Stemming + Trigram + RRF Fusion</text>
    <text x="16" y="58" font-family="monospace" font-size="9.5" fill="#c9d1d9">• Think-in-Code Sandbox keeps raw logs out of context</text>
    <text x="16" y="74" font-family="monospace" font-size="9.5" fill="#3fb950">• Atomic flock state locking · 60s tick · Auto-rollback</text>
  </g>
</svg>
